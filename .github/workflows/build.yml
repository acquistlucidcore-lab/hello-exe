name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build EXE
        run: gcc hello.c -o hello.exe

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: hello-exe
          path: hello.exe
